params:
    description: "Chao-Shan Hsu is a doctoral researcher in art history at the University of Vienna, working on the normative and cultural conditions of aesthetic perception."
    author: Chao-Shan Hsu
    images: [cover.png]
    DateFormat: January 2006
    defaultTheme: light
    hideFooter: true
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    ShowWordCount: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    disableScrollToTop: true
    ShowCodeCopyButtons: false
    ShowToc: false
    UseHugoToc: true
    comments: false
    math: false
    profileMode:
          enabled: true
          title: Chao-Shan Hsu
          subtitle: "I am a doctoral researcher in art history at the University of Vienna, working at the intersection of analytic aesthetics, philosophy of perception, and empirical cognitive science. My research investigates the normative and cultural conditions of aesthetic perception—how cultural training shapes the way we see art, and what philosophical consequences follow. I combine eye-tracking methodology with philosophical argumentation."
          imageUrl: /picture.jpg
          imageWidth: 250
          imageHeight: 250
          buttons:
            - name: Research
              url: /research/
            - name: Papers
              url: /papers/
            - name: Talks
              url: /talks/

    socialIcons:
