baseURL: https://chaoshanhsu.github.io/
title: Chao-Shan Hsu
theme: PaperMod
pagination:
  pagerSize: 40

menu:
    main:
        - name: Research
          url: /research/
          weight: 1
        - name: Papers
          url: /papers/
          weight: 2
        - name: Talks
          url: /talks/
          weight: 3
        - name: CV
          url: /cv.pdf
          weight: 4

params:
    description: "I am a doctoral researcher in art history at the University of Vienna, supervised by Raphael Rosenberg. My research interests lie in art perception, analytic aesthetics, and philosophy of perception."
    author: Chao-Shan Hsu
    images: [cover.png]
    DateFormat: January 2006
    defaultTheme: light
    hideFooter: true
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    ShowWordCount: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    disableScrollToTop: true
    ShowCodeCopyButtons: false
    ShowToc: false
    UseHugoToc: true
    comments: false
    math: false
    profileMode:
          enabled: true
          title: Chao-Shan Hsu
          subtitle: "I am a doctoral researcher in art history at the University of Vienna, supervised by [Raphael Rosenberg](https://kunstgeschichte.univie.ac.at/personen/professoreninnen/rosenberg-raphael/). My research interests lie in art perception, analytic aesthetics, and philosophy of perception. For more, see [Research](/research/)."
          imageUrl: /picture.jpg
          imageWidth: 250
          imageHeight: 250
          buttons:
            - name: Research
              url: /research/
            - name: Papers
              url: /papers/
            - name: Talks
              url: /talks/

    socialIcons:
        - name: GoogleScholar
          url: https://scholar.google.com/citations?user=YOUR_ID
        - name: ORCID
          url: https://orcid.org/0009-0001-0965-9157
        - name: PhilPeople
          url: https://philpeople.org/profiles/chao-shan-hsu

    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: true
        hiddenInSingle: true
    label:
      text: Chao-Shan Hsu

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: xcode 
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2

enableInlineShortcodes: true
enableRobotsTXT: true
titleCaseStyle: none
buildFuture: true
disableKinds: [taxonomy, term]
