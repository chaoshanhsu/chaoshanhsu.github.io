          url: /cv.pdf
        - name: Email
          url: mailto:chao-shan.hsu@univie.ac.at
        - name: Google Scholar
          url: https://scholar.google.com/citations?user=YOUR_ID
        - name: ORCID
          url: https://orcid.org/0009-0001-0965-9157
        - name: GitHub
          url: https://github.com/chaoshanhsu

    assets:
        disableScrollBarStyle: true
