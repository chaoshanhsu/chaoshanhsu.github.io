<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #dedcdd;
      --fg: #292524;
      --fg2: #78716c;
      --border: rgba(0,0,0,0.15);
      --serif: 'Source Serif 4', Georgia, serif;
      --sans: 'Inter', system-ui, sans-serif;
    }
    [data-theme="dark"] {
      --bg: #1c1917;
      --fg: #d6d3d1;
      --fg2: #a8a29e;
      --border: rgba(255,255,255,0.12);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--serif);
      background: var(--bg);
      color: var(--fg);
      font-size: 15px;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    nav {
      position: sticky; top: 0; z-index: 50;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: rgba(222,220,221,0.85);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
    }
    [data-theme="dark"] nav { background: rgba(28,25,23,0.85); }
    .nav-inner {
      max-width: 800px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      height: 52px;
    }
    .nav-name {
      font-weight: 600; font-size: 1rem;
      color: var(--fg); text-decoration: none;
    }
    .nav-links { display: flex; align-items: center; gap: 24px; }
    .nav-links a {
      font-family: var(--sans); font-size: 0.85rem;
      color: var(--fg2); text-decoration: none; transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--fg); }
    .theme-btn {
      background: none; border: none; cursor: pointer;
      font-family: var(--sans); font-size: 0.8rem;
      color: var(--fg2); transition: color 0.2s; padding: 4px 0;
    }
    .theme-btn:hover { color: var(--fg); }

    .container { max-width: 960px; margin: 0 auto; padding: 0 24px; }

    /* Page title */
    .page-title {
      font-size: 2rem; font-weight: 600;
      text-align: center;
      margin: 120px 0 80px;
    }

    /* Hero */
    .hero {
      display: flex; gap: 48px; align-items: center;
      padding: 100px 0 60px;
    }
    .hero-text { flex: 1; }
    .hero-text h1 {
      font-size: 2.2rem; font-weight: 600;
      line-height: 1.3; margin-bottom: 20px;
    }
    .hero-text p {
      font-size: 0.95rem; color: var(--fg2);
      line-height: 1.8; margin-bottom: 12px;
    }
    .hero-text a { color: var(--fg); }
    .hero-links {
      display: flex; gap: 20px; margin-top: 20px; font-size: 0.9rem;
    }
    .hero-links a {
      color: var(--fg2); text-decoration: none;
      display: inline-flex; align-items: center; gap: 4px;
      transition: color 0.2s;
    }
    .hero-links a:hover { color: var(--fg); }
    .hero-photo img {
      width: 440px; height: auto;
      border-radius: 12px;
    }

    /* Markdown content */
    .page-content { padding-bottom: 60px; }
    .page-content h2 {
      font-size: 1.5rem; font-weight: 600;
      position: relative;
      margin: 3em 0 1em;
      list-style: none;
    }
    .page-content h2:first-child { margin-top: 0; }
    .page-content ul, .page-content ol { list-style: none; padding-left: 0; }
    .page-content h3 {
      font-size: 1.1rem; font-weight: 600;
      margin: 1.5em 0 0.5em;
    }
    .page-content p {
      margin: 0.8em 0; line-height: 1.8;
    }
    .page-content a {
      color: var(--fg); text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: var(--border);
      transition: text-decoration-color 0.2s;
    }
    .page-content a:hover { text-decoration-color: var(--fg); }
    .page-content .journal {
      color: #6b7d8d; font-style: italic;
    }
    [data-theme="dark"] .page-content .journal {
      color: #8da8b8;
    }
    .page-content ul, .page-content ol {
      padding-left: 1.2em; margin: 0.8em 0;
    }
    .page-content li { margin: 0.4em 0; line-height: 1.8; }
    .page-content hr {
      border: none; border-top: 1px solid var(--border); margin: 3em 0;
    }
    .page-content .entry {
      padding: 1em 0;
      border-bottom: 1px solid var(--border);
    }
    .page-content .entry:last-child { border-bottom: none; }
    .page-content .entry-date {
      font-family: var(--sans); font-size: 0.85rem;
      color: var(--fg2); margin-bottom: 4px;
    }
    .page-content .entry-desc { line-height: 1.8; }

    /* Pub cards (papers/talks sub-pages) */
    .pub-list { display: flex; flex-direction: column; margin-bottom: 48px; }
    .pub-card {
      border-bottom: 1px solid var(--border);
      padding: 20px 0; cursor: pointer;
    }
    .pub-card h3 {
      font-size: 1.1rem; font-weight: 600; margin-bottom: 6px;
    }
    .pub-meta {
      font-family: var(--sans); font-size: 0.85rem; color: var(--fg2);
      display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px;
    }
    .pub-tag {
      font-family: var(--sans); font-size: 0.75rem;
      padding: 2px 8px; border-radius: 4px;
      border: 1px solid var(--border); color: var(--fg2);
    }
    .pub-abstract {
      font-size: 0.92rem; color: var(--fg2); line-height: 1.7;
      max-height: 0; overflow: hidden;
      transition: max-height 0.3s ease, margin 0.3s ease;
    }
    .pub-card.open .pub-abstract { max-height: 600px; margin-top: 12px; }
    .pub-abstract a {
      color: var(--fg); text-decoration: underline;
      text-underline-offset: 3px; text-decoration-color: var(--border);
    }
    .pub-toggle {
      background: none; border: none; cursor: pointer;
      font-family: var(--sans); font-size: 0.8rem; color: var(--fg2);
      padding: 0; margin-top: 8px;
    }
    .pub-toggle:hover { color: var(--fg); }

    footer {
      border-top: 1px solid var(--border);
      padding: 40px 0; margin-top: 60px;
      text-align: center;
      font-family: var(--sans); font-size: 0.8rem; color: var(--fg2);
    }

    @media (max-width: 640px) {
      .hero { flex-direction: column-reverse; gap: 24px; text-align: center; padding: 60px 0 40px; }
      .hero-photo img { width: 150px; height: 150px; }
      .hero-text h1 { font-size: 1.8rem; }
      .hero-links { justify-content: center; }
      .nav-links { gap: 16px; }
      .page-title { font-size: 1.6rem; margin: 80px 0 50px; }
      .page-content h2 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="/" class="nav-name">{{ site.Title }}</a>
      <div class="nav-links">
        <a href="/profile/">Profile</a>
        <a href="/research/">Research</a>
        <button class="theme-btn" id="theme-toggle" aria-label="Toggle theme">Dark</button>
      </div>
    </div>
  </nav>
  <div class="container">
    {{ block "main" . }}{{ end }}
  </div>
  <footer><div class="container">&copy; {{ now.Year }} {{ site.Title }}</div></footer>
  <script>
    (function(){
      var t = document.getElementById('theme-toggle');
      var html = document.documentElement;
      var saved = localStorage.getItem('theme');
      if (saved === 'dark') {
        html.setAttribute('data-theme','dark');
      }
      function update(){ t.textContent = html.getAttribute('data-theme')==='dark' ? 'Light' : 'Dark'; }
      update();
      t.addEventListener('click', function(){
        if (html.getAttribute('data-theme')==='dark') {
          html.removeAttribute('data-theme');
          localStorage.setItem('theme','light');
        } else {
          html.setAttribute('data-theme','dark');
          localStorage.setItem('theme','dark');
        }
        update();
      });
    })();
  </script>
</body>
</html>
